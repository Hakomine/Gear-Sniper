name: Preise sammeln

on:
  schedule:
    # Schnelllauf: Watchlist, Kleinanzeigen und ein rotierender Katalog-Block.
    # Bewusst NICHT '*/30': zur vollen und halben Stunde stehen bei GitHub die
    # meisten Zeitplaene an, und geplante Laeufe werden bei Last als Erstes
    # fallen gelassen. Gemessen 26.-28.08.2026: aus dem 30-Minuten-Takt wurden
    # Luecken von 5 bis 9 Stunden, ohne einen einzigen fehlgeschlagenen Lauf -
    # die Laeufe wurden gar nicht erst erzeugt. Krumme Minuten liegen neben
    # dem Andrang.
    - cron: '8,38 * * * *'
    # Nachtlauf: kompletter Elgato-Katalog (dauert ~10 Min).
    # Ebenfalls krumm: 3:00 UTC ist der meistbelegte Cron-Slot ueberhaupt.
    - cron: '13 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'fast oder full'
        required: false
        default: 'fast'

# Der Job schreibt prices.json zurück ins Repo
permissions:
  contents: write

# Zwei Läufe gleichzeitig würden sich beim Commit in die Quere kommen
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Der Volllauf braucht real ~25 Min (578 Produkte, 1 Sek Pause dazwischen).
    # Lieber Luft lassen, als den Job mittendrin abschneiden.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Modus bestimmen
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "13 3 * * *" ]; then
            echo "value=full" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.mode || 'fast' }}" >> "$GITHUB_OUTPUT"
          fi

      # Der Abholort steht nicht im Repo - das hier ist oeffentlich. Er kommt
      # aus Repo-Secrets. Fehlen sie, sucht der Sammler bundesweit statt
      # abzubrechen; dann stehen im Cloud-Alarm eben auch unerreichbare Funde.
      - name: Sammeln
        env:
          SNIPER_ORT_ID: ${{ secrets.SNIPER_ORT_ID }}
          SNIPER_PLZ: ${{ secrets.SNIPER_PLZ }}
          SNIPER_ORT: ${{ secrets.SNIPER_ORT }}
        run: node collector.mjs --mode=${{ steps.mode.outputs.value }}

      # Der Fehler-Alarm unten greift nur, wenn der Job ABSTUERZT. Der teurere
      # Fall ist ein Sammler, der sauber durchlaeuft und dabei nichts findet -
      # etwa weil Elgato die Seitenstruktur geaendert hat oder Kleinanzeigen
      # dauerhaft sperrt. Dann wuerde eine leere Datei committet, alles saehe
      # "frisch" aus, und niemand merkte es. Auch die Stale-Warnung des Workers
      # greift dann nicht, denn die Daten SIND ja neu - nur leer.
      #
      # Schlaegt die Pruefung an, bricht der Job ab. Das ist Absicht: dann wird
      # nichts committet, die letzten guten Daten bleiben stehen, und der
      # Discord-Alarm unten laeuft ueber den vorhandenen failure()-Zweig.
      #
      # Schwellen bewusst locker (real: 652 Preise, 31 Modelle). Sie sollen
      # einen Zusammenbruch fangen, nicht jede Schwankung.
      - name: Plausibilität prüfen
        run: |
          node -e '
            const fs = require("fs");
            const preise = JSON.parse(fs.readFileSync("prices.json", "utf8"));
            const markt  = JSON.parse(fs.readFileSync("markt.json", "utf8"));
            const nPreise = (preise.items || []).length;
            const modelle = markt.modelle || {};
            const nModelle = Array.isArray(modelle) ? modelle.length : Object.keys(modelle).length;

            console.log(`${nPreise} Preise, ${nModelle} Modelle mit Marktpreis`);

            const fehler = [];
            if (nPreise  <  300) fehler.push(`nur ${nPreise} Preise (erwartet >= 300)`);
            if (nModelle <   15) fehler.push(`nur ${nModelle} Modelle mit Marktpreis (erwartet >= 15)`);
            if (fehler.length) {
              console.error("Datenlage unplausibel: " + fehler.join(", "));
              process.exit(1);
            }
          '

      - name: Ergebnis committen
        run: |
          git config user.name  "gear-sniper-bot"
          git config user.email "actions@github.com"
          git add prices.json deals.json history.json markt.json
          if git diff --staged --quiet; then
            echo "Keine Preisaenderung"
          else
            git commit -m "Preise ${{ steps.mode.outputs.value }} $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi

      # Ohne das wäre ein kaputter Sammler unsichtbar: der Worker meldet zwar
      # veraltete Daten, aber erst nach 90 Minuten.
      - name: Bei Fehlschlag Discord benachrichtigen
        if: failure()
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$HOOK" ] && exit 0
          curl -sS -X POST "$HOOK" -H 'content-type: application/json' -d @- <<JSON
          {
            "username": "Gear Sniper",
            "content": "⚠️ **Sammler fehlgeschlagen** (${{ steps.mode.outputs.value }})",
            "embeds": [{
              "title": "GitHub Actions Log",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "description": "Der Sammellauf ist abgebrochen ODER die Datenlage war unplausibel (zu wenig Preise/Modelle). Meist hat Elgato die Seitenstruktur geaendert oder eine Quelle sperrt dauerhaft. Es wurde nichts committet, die letzten guten Daten stehen noch.",
              "color": 16007990
            }]
          }
          JSON
