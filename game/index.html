<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Scherbenfeld</title>
    <style>
      /*
       * Die eine mitgelieferte Schrift.
       *
       * Sie liegt lokal unter `public/schrift/` (SIL Open Font License, der
       * Lizenztext steht daneben) und wird *nicht* nachgeladen: kein externer
       * Abruf, kein Netz noetig, und im spaeteren Steam-Paket aendert sich
       * nichts. 22 kB fuer eine Oberflaeche, die nicht mehr nach Terminal
       * aussieht.
       *
       * `font-display: block` statt `swap`: Ein sichtbarer Wechsel von der
       * Ersatzschrift zur richtigen mitten im Titelbild waere genau der
       * Eindruck von "billig gemacht", den diese Runde loswerden soll. Das
       * Spiel wartet in `main.ts` ohnehin auf `document.fonts.ready`, bevor es
       * das erste Bild zeichnet.
       */
      @font-face {
        font-family: 'Space Grotesk';
        src: url('/schrift/space-grotesk.woff2') format('woff2');
        font-weight: 400 700;
        font-style: normal;
        font-display: block;
      }

      /* Das Spiel zeichnet alles selbst. CSS hat genau eine Aufgabe:
         die Leinwand mittig und randlos auf schwarzem Grund halten. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #04050b;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        /* Die Leinwand wird in echten Bildpunkten angelegt (Fenstergroesse
           mal Pixeldichte), es wird also gar nicht hochskaliert. Weiches
           Glaetten ist hier trotzdem richtig: Bei gedeckelter Pixeldichte
           bliebe sonst eine harte Treppe an den runden Formen. */
        touch-action: none;
      }
      /* Fokus-Ring der Leinwand stört im Vollbild-Spiel. Tastatur-Eingaben
         hängen ohnehin am window, nicht am Canvas. */
      canvas:focus {
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="spiel"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
