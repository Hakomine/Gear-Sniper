# Nur nötig, wenn du per CLI (wrangler) deployen willst.
# Einfacher Weg ist das Cloudflare-Dashboard (siehe README).
name = "gear-sniper"
main = "worker.js"
compatibility_date = "2024-11-01"

# DATA_BASE: raw-GitHub-Link zum Ordner mit prices.json (ohne / am Ende)
[vars]
DATA_BASE = "https://raw.githubusercontent.com/DEINNAME/gear-sniper/main"

# KV-Namespace danach binden (id aus: wrangler kv namespace create GEAR_KV)
# [[kv_namespaces]]
# binding = "GEAR_KV"
# id = "..."

[triggers]
crons = ["*/15 * * * *"]

# Webhook danach setzen mit:  wrangler secret put DISCORD_WEBHOOK
