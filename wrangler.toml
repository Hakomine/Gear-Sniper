# Der empfohlene Weg zum Einspielen:  npx wrangler deploy
#
# Nicht über "Edit code" im Dashboard deployen – das wirft die KV-Bindung jedes
# Mal raus (zweimal passiert, siehe README). Hier stehen Code, Bindung,
# Variable und Cron-Takt zusammen und werden gemeinsam gesetzt.
#
# Muss aus DIESEM Ordner laufen: im Home-Verzeichnis stolpert wrangler über
# die gesperrte Windows-Verknüpfung C:\Users\<name>\Anwendungsdaten.
name = "gear-sniper"
main = "worker.js"
compatibility_date = "2024-11-01"

# DATA_BASE: raw-GitHub-Link zum Ordner mit prices.json (ohne / am Ende)
[vars]
DATA_BASE = "https://raw.githubusercontent.com/Hakomine/Gear-Sniper/main"

# KV-Speicher: merkt sich, welche Funde schon gemeldet wurden.
# WICHTIG: Diese Bindung muss hier stehen. Wird der Worker stattdessen über
# "Edit code" im Dashboard eingespielt, wirft Cloudflare sie jedes Mal raus
# (zweimal passiert). Mit "wrangler deploy" kommt sie automatisch mit.
[[kv_namespaces]]
binding = "GEAR_KV"
id = "3a474b4e690e4b8395c90d8fe4f41806"

[triggers]
crons = ["*/15 * * * *"]

# Webhook danach setzen mit:  wrangler secret put DISCORD_WEBHOOK
